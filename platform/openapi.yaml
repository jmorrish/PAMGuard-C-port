    MatchedTemplateSessionConfig:
      description: >
        Legacy-session wrapper around the same strict Java-authoritative
        MatchedTemplateParams contract used by project modules. Disabled
        classifiers accept only enabled=false; enabled classifiers require
        every operational Java field.
      oneOf:
        - type: object
          additionalProperties: false
          required: [enabled]
          properties:
            enabled:
              type: boolean
              const: false
        - type: object
          additionalProperties: false
          required:
            - enabled
            - clickType
            - normalisationType
            - peakSearch
            - peakSmoothing
            - lengthDb
            - restrictedBins
            - channelClassification
            - classifiers
          properties:
            enabled:
              type: boolean
              const: true
            clickType:
              type: integer
              anyOf:
                - const: 0
                - minimum: 100
                  maximum: 255
              description: >
                Unsigned view of Java's byte type. Zero is the byte-wrapped
                representation of the Java dialog's value 256.
            normalisationType:
              type: integer
              enum: [0, 1, 2]
            peakSearch:
              type: boolean
            peakSmoothing:
              type: integer
              minimum: 3
              maximum: 1025
              description: Must be odd, matching the Java dialog list.
            lengthDb:
              type: number
              minimum: 0.1
              maximum: 300
            restrictedBins:
              type: integer
              minimum: 4
              maximum: 131072
              description: Must be a power of two, matching the Java dialog list.
            channelClassification:
              type: integer
              enum: [0, 1]
            classifiers:
              type: array
              minItems: 1
              maxItems: 64
              items:
                $ref: "#/components/schemas/MatchedTemplatePair"

    MatchTemplateWaveform:
      type: object
