          $ref: "#/components/schemas/ProjectRoleId"
      additionalProperties: false
    AddControlledUnitMutation:
      type: object
      required: [op, clientRef, typeId, name, dependencyPolicy]
      properties:
        op:
          type: string
          const: addControlledUnit
        clientRef:
          $ref: "#/components/schemas/ProjectEntityId"
        typeId:
          $ref: "#/components/schemas/ProjectEntityId"
        name:
          type:
            - string
            - "null"
          maxLength: 50
          description: Optional explicit Java-style item name; null selects the descriptor default and a unique suffix.
        dependencyPolicy:
          type: string
          enum: [reject, add-defaults]
          description: >-
            add-defaults creates and binds the declared provider only when no
            compatible source exists. One compatible source is bound
            automatically. If several compatible sources exist, the unit is
            added with an empty required binding and the project reports
            needs-configuration until the operator chooses a source; the
            service never makes an arbitrary scientific source choice.
      additionalProperties: false
    AddConfigurationTemplateMutation:
      type: object
      description: >-
        Atomically expands a registered configuration template into ordinary project-owned units,
        bindings, displays, and layout. pamguard.click-monitoring creates FFT, User Display with a
        Spectrogram, Click Detector with its static Click display, and Sound Output branches. It
        creates Acquisition when none exists, reuses exactly one existing Acquisition, and rejects
        an ambiguous project with multiple Acquisitions. Generated controlled-unit clientRefs are
        the supplied clientRef plus :acquisition (only returned as created when new), :fft,
        :userDisplay, :clickDetector, and :soundOutput.
      required: [op, clientRef, templateId]
      properties:
        op:
          type: string
          const: addConfigurationTemplate
        clientRef:
          type: string
          minLength: 1
          maxLength: 114
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$"
          description: Base client reference; limited to leave room for stable generated child references.
        templateId:
          type: string
          const: pamguard.click-monitoring
      additionalProperties: false
    RenameControlledUnitMutation:
      type: object
      required: [op, unit, name]
      properties:
        op:
          type: string
          const: renameControlledUnit
