    DataBlock:
      type: object
      required: [id, name, producerModuleId, producerPortId, dataType, schemaVersion, sampleRateHz, channelBitmap, sequenceBitmap, fftLength, fftHop, calibrationDbOffsetByChannel, voltsPeakToPeak, capabilities, historyCapacity, clockDomainId, retentionPolicy, persistenceProviders, exportProviders, stats]
      properties:
        id:
          type: string
        name:
          type: string
        producerModuleId:
          type: string
        producerPortId:
          type: string
        dataType:
          type: string
        schemaVersion:
          type: integer
        sampleRateHz:
          type: number
        channelBitmap:
          type: integer
        sequenceBitmap:
          type: integer
        minimumFrequencyHz:
          type:
            - number
            - "null"
        maximumFrequencyHz:
          type:
            - number
            - "null"
        fftLength:
          description: FFT transform length inherited by FFT-domain consumers; null for non-FFT or legacy external blocks.
          type:
            - integer
            - "null"
          minimum: 1
        fftHop:
          description: FFT slice hop inherited by FFT-domain consumers; null for non-FFT or legacy external blocks.
          type:
            - integer
            - "null"
