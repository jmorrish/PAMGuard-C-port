openapi: 3.1.0
info:
  title: PAMGuard Enterprise Port API
  version: 0.1.0
  description: >-
    API contract for the project-authoritative controlled-unit model,
    generated runtime graph, and live data/audio streams. Deprecated
    AnalysisSession, archive, offline-job, and legacy runtime-identity routes
    are an isolated scientific-oracle surface available only when
    PAMGUARD_LEGACY_MODEL_COMPAT=1.
paths:
  /v1/controlled-unit-types:
    get:
      summary: List Java-authoritative controlled-unit and display-provider types
      description: Returns the immutable descriptor catalogue used to construct and validate project mutation requests, including strict Java-authoritative settings and runtime-expansion contracts for Filter, Decimator, Noise Monitor, Noise Band Monitor, LTSA, and the Whistle and Moan Detector.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Controlled-unit descriptor catalogue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlledUnitCatalogue"
        "401":
          description: Unauthorized
        "500":
          description: Catalogue unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectError"
  /v1/projects:
    get:
      summary: List saved PAMGuard projects
      description: Includes available projects and entries that could only be classified as corrupt or unsupported.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Saved project summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedProjectList"
        "401":
          description: Unauthorized
        "500":
          description: Project store unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectError"
  /v1/projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      summary: Read one durable project file
      description: Returns the exact saved envelope. This route never changes which project is active.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Durable project envelope
          headers:
            ETag:
              $ref: "#/components/headers/ProjectETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectFileEnvelope"
        "400":
          description: projectId is not a lowercase UUIDv4
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectError"
        "401":
          description: Unauthorized
        "404":
          description: Saved project does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectError"
        "422":
          description: Saved project is corrupt or uses an unsupported format or schema
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectError"
        "500":
          description: Project store error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectError"
  /v1/projects/active:
    get:
      summary: Read the authoritative in-memory project
      description: The response ETag is the strong concurrency token required by every active-project command and mutation, including validation-only mutation batches.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Active project snapshot
          headers:
            ETag:
              $ref: "#/components/headers/ProjectETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveProjectSnapshot"
        "401":
          description: Unauthorized
  /v1/projects/active/inspection:
    get:
      summary: Inspect the active project's generated runtime and ownership index
      description: Shows deterministic runtime children, blocks, bindings, connections, displays, and the generated low-level graph without creating a second writable authority.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Generated projection inspection
          headers:
            ETag:
              $ref: "#/components/headers/ProjectETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectInspection"
        "401":
          description: Unauthorized
  /v1/projects/active/compatible-sources:
    get:
      summary: Find project-level sources compatible with a controlled-unit input
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - in: query
          name: unitId
          required: true
          schema:
            $ref: "#/components/schemas/ProjectUuid"
        - in: query
          name: inputRole
          required: true
          schema:
            $ref: "#/components/schemas/ProjectRoleId"
      responses:
        "200":
          description: Compatible public outputs
          headers:
            ETag:
              $ref: "#/components/headers/ProjectETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCompatibleSources"
        "400":
          description: Missing or malformed query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectError"
        "401":
          description: Unauthorized
        "404":
          description: Target public input does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectError"
        "422":
          description: Target unit, role, or descriptor is not usable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectError"
  /v1/projects/active/click-detectors/{clickDetectorUnitId}/tracked-events:
    parameters:
      - $ref: "#/components/parameters/ClickDetectorUnitId"
    get:
      summary: List manual tracked-click events for one Click Detector
      description: >-
        Returns the retained-runtime equivalent of PAMGuard OfflineEventDataUnit membership.
        Event relationships are scientific runtime data scoped to the active project working
        revision; ClickLocParams remain portable controlled-unit settings.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Current manual tracked events and localisation prerequisites
          headers:
            ETag:
              $ref: "#/components/headers/ProjectETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackedClickEventList"
        "401":
          description: Unauthorized
        "404":
          description: Click Detector controlled unit does not exist
        "409":
          description: Isolated legacy-model compatibility mode is active
        "500":
          description: Tracked-event state could not be read
  /v1/projects/active/click-detectors/{clickDetectorUnitId}/tracked-events:assign:
    parameters:
      - $ref: "#/components/parameters/ClickDetectorUnitId"
    post:
      summary: Assign retained clicks to a manual tracked event
      description: >-
        A null eventId creates max(existing event ID)+1, matching TrackedClickLocaliser. An
        existing eventId moves clicks from their former event first and deletes empty former
        events. This is not the automatic simple click-train tracker.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignTrackedClicksRequest"
      responses:
        "200":
          description: Clicks assigned to an existing event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackedClickEvent"
        "201":
          description: New event created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackedClickEvent"
        "400":
          description: Invalid retained-click locators or event ID
        "404":
          description: Click Detector, retained click, or target event does not exist
        "409":
          description: Click runtime is not prepared at the active working revision
  /v1/projects/active/click-detectors/{clickDetectorUnitId}/tracked-clicks/{clickUid}:
    parameters:
      - $ref: "#/components/parameters/ClickDetectorUnitId"
      - name: clickUid
        in: path
        required: true
        schema:
          type: integer
          format: uint64
          minimum: 1
    delete:
      summary: Remove one click from its manual tracked event
      description: Deletes the event as PAMGuard does when its last click is removed.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Click membership removed
        "400":
          description: Invalid click UID
        "404":
          description: Click Detector or click membership does not exist
  /v1/projects/active/click-detectors/{clickDetectorUnitId}/tracked-events/{trackedEventId}:
    parameters:
      - $ref: "#/components/parameters/ClickDetectorUnitId"
      - $ref: "#/components/parameters/TrackedEventId"
    delete:
      summary: Delete one manual tracked event
      description: Removes the event and all of its click membership relationships.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Event deleted
        "400":
          description: Invalid event ID
        "404":
          description: Click Detector or tracked event does not exist
  /v1/projects/active/click-detectors/{clickDetectorUnitId}/tracked-events/{trackedEventId}:reassign:
    parameters:
      - $ref: "#/components/parameters/ClickDetectorUnitId"
      - $ref: "#/components/parameters/TrackedEventId"
    post:
      summary: Reassign an entire manual tracked event
      description: Moves all source-event clicks to an existing target and deletes the source event.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReassignTrackedEventRequest"
      responses:
        "200":
          description: Combined target event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackedClickEvent"
        "400":
          description: Invalid or identical source and target IDs
        "404":
          description: Click Detector, source event, or target event does not exist
  /v1/projects/active/click-detectors/{clickDetectorUnitId}/tracked-events/{trackedEventId}:localise:
    parameters:
      - $ref: "#/components/parameters/ClickDetectorUnitId"
      - $ref: "#/components/parameters/TrackedEventId"
    post:
      summary: Assess and run selected PAMGuard group-localisation algorithms
      description: >-
        Uses the ClickLocParams persisted on the Click Detector. Until retained clicks carry
        navigation-derived moving array origins/headings, bearing algorithms return an explicit
        scientific-prerequisite conflict. MCMC is additionally Viewer-only and needs per-click
        hydrophone/time-delay geometry. No automatic-train result is substituted.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Least Squares executed, including raw fits and PAMGuard post-fit filtering
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackedClickLocalisationRun"
        "400":
          description: Invalid event ID or request body
        "404":
          description: Click Detector or tracked event does not exist
        "409":
          description: Selected algorithms lack required bearings, origins, navigation track, geometry, or run mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackedClickLocalisationRun"
  /v1/projects/active/acquisitions:
    get:
      summary: List active project Acquisition instances
      description: >-
        Returns only stable project controlled-unit identities and operator-facing audio/capture
        state. Generated runtime node identifiers are deliberately not part of this contract.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Active Acquisition instances
          headers:
            ETag:
              $ref: "#/components/headers/ProjectETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveAcquisitionList"
        "401":
          description: Unauthorized
        "409":
          description: Isolated legacy-model compatibility mode is active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionOperatorError"
        "500":
          description: Acquisition state could not be reconciled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionOperatorError"
  /v1/projects/active/acquisitions/{acquisitionUnitId}/host-binding:
    parameters:
      - $ref: "#/components/parameters/AcquisitionUnitId"
    get:
      summary: Read one Acquisition instance's host binding
      description: >-
        Host bindings are deployment state keyed by stable project and Acquisition unit identity.
        Their command target advances to the current working revision while that Acquisition still
        exists, so unrelated display/layout edits do not discard the selected host source. They are
        separate from portable Java-authoritative Acquisition settings.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Current host binding
          headers:
            ETag:
              $ref: "#/components/headers/ProjectETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionHostBinding"
        "401":
          description: Unauthorized
        "404":
          description: Acquisition instance or host binding does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionOperatorError"
        "409":
          description: Active-project mode is unavailable or the binding target became stale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionOperatorError"
        "500":
          description: Acquisition state could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionOperatorError"
    put:
      summary: Create or compare-and-swap an Acquisition host binding
      description: >-
        Device bindings must exactly match current host enumeration. URL bindings accept bounded,
        non-credentialed HTTP(S) URLs. Executable paths, FFmpeg options, credentials, process IDs,
        and generated runtime IDs cannot be supplied. expectedBindingRevision 0 is create-only;
        a non-zero value must exactly match the current binding.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutAcquisitionHostBindingRequest"
      responses:
        "200":
          description: Existing binding replaced
          headers:
            ETag:
              $ref: "#/components/headers/ProjectETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PutAcquisitionHostBindingResponse"
        "201":
          description: Binding created
          headers:
            ETag:
              $ref: "#/components/headers/ProjectETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PutAcquisitionHostBindingResponse"
        "400":
          description: Malformed source or non-conforming strict request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionOperatorError"
        "401":
          description: Unauthorized
        "404":
          description: The target is not an active pamguard.acquisition controlled unit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionOperatorError"
        "409":
          description: Working revision or binding revision is stale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionOperatorError"
        "501":
          description: Exact host-device binding is unavailable on this platform
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionOperatorError"
        "502":
          description: FFmpeg device enumeration failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionOperatorError"
        "503":
          description: Capture is disabled for host-device binding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionOperatorError"
        "500":
          description: Binding operation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionOperatorError"
    delete:
      summary: Delete an Acquisition host binding with compare-and-swap
      description: Deleting a binding also stops any capture child for the exact instance target.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAcquisitionHostBindingRequest"
      responses:
        "200":
          description: Delete result
          headers:
            ETag:
              $ref: "#/components/headers/ProjectETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteAcquisitionHostBindingResponse"
        "400":
          description: Malformed or non-conforming strict request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionOperatorError"
        "401":
          description: Unauthorized
        "404":
          description: The target is not an active pamguard.acquisition controlled unit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionOperatorError"
        "409":
          description: Working revision or binding revision is stale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionOperatorError"
        "500":
          description: Binding operation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionOperatorError"
  /v1/projects/active/acquisitions/{acquisitionUnitId}/capture-status:
    parameters:
      - $ref: "#/components/parameters/AcquisitionUnitId"
    get:
      summary: Read capture status for one active Acquisition instance
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Capture status
          headers:
            ETag:
              $ref: "#/components/headers/ProjectETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionCaptureStatus"
        "401":
          description: Unauthorized
        "404":
          description: The target is not an active pamguard.acquisition controlled unit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionOperatorError"
        "500":
          description: Capture state could not be reconciled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionOperatorError"
  "/v1/projects/active/acquisitions/{acquisitionUnitId}/capture:start":
    parameters:
      - $ref: "#/components/parameters/AcquisitionUnitId"
    post:
      summary: Start the bound capture for one active Acquisition instance
      description: >-
        Resolves the generated acquisition node internally from the active project. URL capture is
        available on Windows; exact audio-device capture requires Windows DirectShow. On non-Windows
        hosts the current shell-backed, Windows-binary-mode ffmpeg_stream_ingest pipe is reported as
        unavailable rather than invoked unsafely; supervised PCM ingest remains cross-platform. The
        bridge rejects shell-expansion characters even in otherwise valid host sources.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpectedAcquisitionWorkingRevision"
      responses:
        "200":
          description: Capture child started
          headers:
            ETag:
              $ref: "#/components/headers/ProjectETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionCaptureStartResponse"
        "400":
          description: Malformed or non-conforming strict request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionOperatorError"
        "401":
          description: Unauthorized
        "404":
          description: Acquisition instance or host binding does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionOperatorError"
        "409":
          description: Working revision is stale, runtime unavailable, bound device absent, or capture already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionOperatorError"
        "422":
          description: Bound source cannot safely be passed through the current ingest bridge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionOperatorError"
        "501":
          description: Bound host-device or URL ingest-bridge capture is unavailable on this platform
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionOperatorError"
        "502":
          description: Device enumeration or child-process start failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionOperatorError"
        "503":
          description: Capture is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionOperatorError"
        "500":
          description: Capture start failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionOperatorError"
  "/v1/projects/active/acquisitions/{acquisitionUnitId}/capture:stop":
    parameters:
      - $ref: "#/components/parameters/AcquisitionUnitId"
    post:
      summary: Stop capture for one active Acquisition instance
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpectedAcquisitionWorkingRevision"
      responses:
        "200":
          description: Capture child stopped and reaped
          headers:
            ETag:
              $ref: "#/components/headers/ProjectETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionCaptureStopResponse"
        "400":
          description: Malformed or non-conforming strict request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionOperatorError"
        "401":
          description: Unauthorized
        "404":
          description: Acquisition instance or running capture does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionOperatorError"
        "409":
          description: Working revision is stale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionOperatorError"
        "500":
          description: Capture stop failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionOperatorError"
  /v1/projects/active/acquisitions/{acquisitionUnitId}/pcm-f32le:
    parameters:
      - $ref: "#/components/parameters/AcquisitionUnitId"
      - $ref: "#/components/parameters/ExpectedProjectIdQuery"
      - $ref: "#/components/parameters/ExpectedAcquisitionWorkingRevisionQuery"
      - in: query
        name: startSample
        schema:
          type: integer
          format: int64
          minimum: 0
      - in: query
        name: timeMs
        schema:
          type: integer
          format: int64
      - in: query
        name: headingDegrees
        description: Array heading at this chunk; heading, pitch, and roll must be supplied together.
        schema:
          type: number
      - in: query
        name: pitchDegrees
        schema:
          type: number
      - in: query
        name: rollDegrees
        schema:
          type: number
      - in: query
        name: originEastMetres
        description: Local array-centroid east coordinate; all three origin coordinates must be supplied together.
        schema:
          type: number
      - in: query
        name: originNorthMetres
        schema:
          type: number
      - in: query
        name: originHeightMetres
        schema:
          type: number
    post:
      summary: Ingest supervised interleaved f32le PCM into one Acquisition instance
      description: >-
        The stable unit ID is resolved internally to the exact generated acquisition node in the
        active project. Requests cannot select a legacy session or generated runtime module.
        The expected project ID and working revision fence a worker from writing after an active
        project switch or edit, even if another project contains the same controlled-unit UUID.
        Optional finite pose triplets are sampled with the chunk and retained through raw-audio
        processing for time-specific click and tracked-event localisation.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "202":
          description: PCM accepted and synchronously published through the selected raw-audio block
          headers:
            ETag:
              $ref: "#/components/headers/ProjectETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionPcmAccepted"
        "400":
          description: Invalid revision parameter, timeline value, or PCM frame shape
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionOperatorError"
        "401":
          description: Unauthorized
        "404":
          description: The target is not an active pamguard.acquisition controlled unit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionOperatorError"
        "409":
          description: Working revision is stale or its projected runtime is not running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionOperatorError"
        "413":
          description: PCM body exceeds the configured service maximum
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionOperatorError"
        "500":
          description: PCM ingest failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionOperatorError"
  /v1/projects/active/sound-recorders/{soundRecorderUnitId}/status:
    parameters:
      - $ref: "#/components/parameters/SoundRecorderUnitId"
    get:
      summary: Read operator status for one active Sound Recorder
      description: >-
        Resolves the stable controlled-unit identity to its generated runtime node internally.
        Host storage paths and generated runtime identities are never returned; an open recording
        is represented only by its filename.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Sound Recorder deployment, runtime, transport, and current-file status
          headers:
            ETag:
              $ref: "#/components/headers/ProjectETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoundRecorderStatus"
        "401":
          description: Unauthorized
        "404":
          description: The target is not an active pamguard.sound-recorder controlled unit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoundRecorderOperatorError"
        "409":
          description: Isolated legacy-model compatibility mode is active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoundRecorderOperatorError"
        "500":
          description: Sound Recorder status could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoundRecorderOperatorError"
  /v1/projects/active/sound-recorders/{soundRecorderUnitId}/transport:
    parameters:
      - $ref: "#/components/parameters/SoundRecorderUnitId"
    put:
      summary: Change transport for one active Sound Recorder
      description: >-
        The command is compare-and-swap protected by the active project working revision.
        Only off and continuous are currently executable. PAMGuard cycle and restore-last are
        reported explicitly as not implemented rather than approximated.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutSoundRecorderTransportRequest"
      responses:
        "200":
          description: Transport applied, or already in the requested mode
          headers:
            ETag:
              $ref: "#/components/headers/ProjectETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoundRecorderStatus"
        "400":
          description: Malformed or non-conforming strict request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoundRecorderOperatorError"
        "401":
          description: Unauthorized
        "404":
          description: The target is not an active pamguard.sound-recorder controlled unit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoundRecorderOperatorError"
        "409":
          description: Working revision is stale or the exact runtime is not prepared and running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoundRecorderOperatorError"
        "501":
          description: The requested PAMGuard transport mode has no implemented runtime semantics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoundRecorderOperatorError"
        "503":
          description: Deployment-owned recording storage is not configured or writable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoundRecorderOperatorError"
        "500":
          description: Sound Recorder transport operation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoundRecorderOperatorError"
  /v1/projects/active/mutations:
    post:
      summary: Validate or atomically apply typed project mutations
      description: >-
        The entire strict batch is evaluated against one active-project ETag. Unknown or duplicate
        JSON fields are rejected. validateOnly returns a preview without changing the active ETag.
        Applying a runtime-affecting batch requires the module runtime to be stopped. Configuration
        templates expand inside the same candidate document and therefore have the same all-or-nothing
        validation, ETag, and commit semantics as individual typed operations.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectMutationBatch"
      responses:
        "200":
          description: Mutation preview or committed result
          headers:
            ETag:
              $ref: "#/components/headers/ProjectETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMutationResult"
        "400":
          description: Malformed JSON or a non-conforming strict mutation body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectError"
        "401":
          description: Unauthorized
        "409":
          description: Runtime is running or a prepared candidate became stale
          headers:
            ETag:
              $ref: "#/components/headers/ProjectETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectError"
        "412":
          $ref: "#/components/responses/ProjectPreconditionFailed"
        "422":
          description: Mutation is syntactically valid but violates project, descriptor, ownership, binding, or projection rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectError"
        "428":
          $ref: "#/components/responses/ProjectPreconditionRequired"
        "500":
          description: Runtime activation or rollback failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectError"
  /v1/projects/active/new:
    post:
      summary: Replace the active project with a new blank project
      description: Stops and replaces a running generated runtime only after the candidate has passed project and runtime preflight.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewProjectRequest"
      responses:
        "200":
          description: New active project
          headers:
            ETag:
              $ref: "#/components/headers/ProjectETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveProjectSnapshot"
        "400":
          description: Malformed or non-conforming strict command body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectError"
        "401":
          description: Unauthorized
        "409":
          description: Active project is dirty and discardDirty is false, or the prepared switch became stale
          headers:
            ETag:
              $ref: "#/components/headers/ProjectETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectError"
        "412":
          $ref: "#/components/responses/ProjectPreconditionFailed"
        "422":
          description: Command violates project authority rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectError"
        "428":
          $ref: "#/components/responses/ProjectPreconditionRequired"
        "500":
          description: Project switch, runtime activation, or rollback failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectError"
  /v1/projects/active/open:
    post:
      summary: Open a saved project as the active project
      description: Stops and replaces a running generated runtime only after the saved candidate has passed project and runtime preflight.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenProjectRequest"
      responses:
        "200":
          description: Opened active project
          headers:
            ETag:
              $ref: "#/components/headers/ProjectETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveProjectSnapshot"
        "400":
          description: Malformed or non-conforming strict command body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectError"
        "401":
          description: Unauthorized
        "404":
          description: Saved project does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectError"
        "409":
          description: Active project is dirty and discardDirty is false, or the prepared switch became stale
          headers:
            ETag:
              $ref: "#/components/headers/ProjectETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectError"
        "412":
          $ref: "#/components/responses/ProjectPreconditionFailed"
        "422":
          description: Saved project is corrupt, unsupported, or cannot be projected under the active descriptor set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectError"
        "428":
          $ref: "#/components/responses/ProjectPreconditionRequired"
        "500":
          description: Project switch, runtime activation, or rollback failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectError"
  /v1/projects/active/save:
    post:
      summary: Save the active project to its durable identity
      description: The request body must be empty. Persistence completes before the returned authority revision and ETag are published.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectIfMatch"
      responses:
        "200":
          description: Saved active project
          headers:
            ETag:
              $ref: "#/components/headers/ProjectETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveProjectSnapshot"
        "400":
          description: Save request contained a body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectError"
        "401":
          description: Unauthorized
        "409":
          description: Durable file changed since it was opened or previously saved
          headers:
            ETag:
              $ref: "#/components/headers/ProjectETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectError"
        "412":
          $ref: "#/components/responses/ProjectPreconditionFailed"
        "422":
          description: Active project cannot be saved under project authority rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectError"
        "428":
          $ref: "#/components/responses/ProjectPreconditionRequired"
        "500":
          description: >-
            Project persistence failed. code project_save_failed means no successful atomic publish
            was reported; correct the storage fault and retry with the returned current ETag.
            code project_save_uncertain means the file may already have been atomically published,
            but directory durability could not be proven. Do not retry blindly: keep the active
            project unchanged, re-read /v1/projects/{projectId}, and reconcile its envelope with
            the active snapshot before deciding whether to retry or open the durable version.
          headers:
            ETag:
              $ref: "#/components/headers/ProjectETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectError"
              examples:
                uncertainPublish:
                  summary: Atomic publish occurred but durability is uncertain
                  value:
                    error: Project file was atomically published, but the project directory durability barrier failed. Reload the saved project before retrying.
                    code: project_save_uncertain
                    currentEtag: '"pgp1-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"'
  /v1/projects/active/save-as:
    post:
      summary: Save the active content as a new durable project identity
      description: Requires an idle runtime. A successful response activates the new project identity and supplies its durable Location.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveAsProjectRequest"
      responses:
        "201":
          description: New durable project created and made active
          headers:
            ETag:
              $ref: "#/components/headers/ProjectETag"
            Location:
              description: URI of the newly saved durable project.
              schema:
                type: string
                pattern: "^/v1/projects/[0-9a-f-]{36}$"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveProjectSnapshot"
        "400":
          description: Malformed or non-conforming strict command body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectError"
        "401":
          description: Unauthorized
        "409":
          description: Runtime is running, target durable identity conflicts, or the prepared state became stale
          headers:
            ETag:
              $ref: "#/components/headers/ProjectETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectError"
        "412":
          $ref: "#/components/responses/ProjectPreconditionFailed"
        "422":
          description: Active project cannot be saved under project authority rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectError"
        "428":
          $ref: "#/components/responses/ProjectPreconditionRequired"
        "500":
          description: >-
            Project persistence or runtime reactivation failed. code project_save_failed means no
            successful atomic publish was reported. code project_save_uncertain means the newly
            identified project may already have been atomically published, but directory durability
            could not be proven and the active project was not switched. Do not issue Save As again
            blindly: refresh /v1/projects, inspect plausible new durable envelopes, and reconcile
            their identity and content before retrying, opening one, or cleaning up a duplicate.
          headers:
            ETag:
              $ref: "#/components/headers/ProjectETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectError"
              examples:
                uncertainPublish:
                  summary: Save As publish occurred but durability is uncertain
                  value:
                    error: Project file was atomically published, but the project directory durability barrier failed. Reload project storage before retrying.
                    code: project_save_uncertain
                    currentEtag: '"pgp1-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"'
  /module-types:
    get:
      summary: List composable module types and typed ports
      description: Returns the runtime module catalogue, settings schemas, defaults, instance limits, and input/output compatibility metadata.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Registered module types
          content:
            application/json:
              schema:
                type: object
                required: [moduleTypes, count]
                properties:
                  moduleTypes:
                    type: array
                    items:
                      $ref: "#/components/schemas/ModuleType"
                  count:
                    type: integer
        "401":
          description: Unauthorized
  /module-graph:
    get:
      summary: Read the generated low-level module graph
      description: Read-only compatibility view generated from the active project. Use the /v1/projects/active routes for all changes.
      tags: [Compatibility]
      deprecated: true
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Current graph document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleGraph"
        "401":
          description: Unauthorized
    put:
      summary: Direct low-level graph writes are disabled
      description: >-
        The active project is the sole write authority, so project mode
        returns project_authority_required. When
        PAMGUARD_LEGACY_MODEL_COMPAT=1, this route writes only the isolated
        compatibility graph and cannot change the active project.
      tags: [Compatibility]
      deprecated: true
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "401":
          description: Unauthorized
        "405":
          description: Project authority is required; Allow is GET
          headers:
            Allow:
              schema:
                type: string
                const: GET
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectAuthorityRequiredError"
  /module-graph/validate:
    post:
      summary: Validate and lifecycle-preflight a candidate graph without changing runtime state
      tags: [Compatibility]
      deprecated: true
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModuleGraph"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                required: [valid, issues]
                properties:
                  valid:
                    type: boolean
                  issues:
                    type: array
                    items:
                      $ref: "#/components/schemas/GraphIssue"
        "400":
          description: Malformed graph document
        "401":
          description: Unauthorized
  /module-graph/compatible-sources:
    get:
      summary: Discover compatible output ports for one graph input
      tags: [Compatibility]
      deprecated: true
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - in: query
          name: moduleId
          required: true
          schema:
            type: string
        - in: query
          name: portId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Type-, capability-, and cycle-compatible sources
          content:
            application/json:
              schema:
                type: object
                required: [sources, count]
                properties:
                  sources:
                    type: array
                    items:
                      $ref: "#/components/schemas/CompatibleSource"
                  count:
                    type: integer
        "400":
          description: Missing target endpoint
        "401":
          description: Unauthorized
  /data-blocks:
    get:
      summary: List the executable runtime's typed data blocks
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Current runtime data-block catalogue
          content:
            application/json:
              schema:
                type: object
                required: [graphRevision, running, dataBlocks, count]
                properties:
                  graphRevision:
                    type: integer
                  running:
                    type: boolean
                  dataBlocks:
                    type: array
                    items:
                      $ref: "#/components/schemas/DataBlock"
                  count:
                    type: integer
        "401":
          description: Unauthorized
  /module-runtime/status:
    get:
      summary: Inspect module lifecycle state and output-block health
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Current graph module states and per-output counters
          content:
            application/json:
              schema:
                type: object
                required: [graphRevision, running, modules, count]
                properties:
                  graphRevision:
                    type: integer
                  running:
                    type: boolean
                  modules:
                    type: array
                    items:
                      type: object
                      required: [moduleId, typeId, name, enabled, state, outputs]
                      properties:
                        moduleId:
                          type: string
                        typeId:
                          type: string
                        name:
                          type: string
                        enabled:
                          type: boolean
                        state:
                          type: string
                          enum: [created, prepared, running, stopped, error, disabled, external]
                        outputs:
                          type: array
                          items:
                            $ref: "#/components/schemas/DataBlock"
                  count:
                    type: integer
        "401":
          description: Unauthorized
  /module-runtime/control:
    post:
      summary: Start, stop, flush, or reset the composable runtime
      description: Cold activation is idle. Stop first quiesces module capture, then flushes buffered scientific units in dependency order and stops nodes in reverse dependency order. A partial stop failure is returned as an error and is not reported as clean idle.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [start, stop, flush, reset]
                restart:
                  type: boolean
                  description: For reset, restore the previous running state by default.
      responses:
        "200":
          description: Lifecycle action completed
          content:
            application/json:
              schema:
                type: object
                required: [action, graphRevision, running, capturesStopped]
                properties:
                  action:
                    type: string
                  graphRevision:
                    type: integer
                  running:
                    type: boolean
                  capturesStopped:
                    type: integer
                    minimum: 0
        "400":
          description: Invalid action or lifecycle state
        "401":
          description: Unauthorized
        "409":
          description: Lifecycle precondition failed
        "500":
          description: Lifecycle operation failed or Stop could not reach clean idle
  /data-blocks/{blockId}/stream:
    get:
      summary: Stream one selected typed data block as NDJSON
      description: Presentation delivery is bounded and drop-oldest, so a slow display cannot block scientific processing. The stream ends when its graph revision is replaced.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - in: path
          name: blockId
          required: true
          schema:
            type: string
        - in: query
          name: channels
          description: Comma-separated channel indices to retain when channel metadata is present.
          schema:
            type: string
            example: "0,1"
        - in: query
          name: sequences
          description: Comma-separated sequence indices to retain when sequence metadata is present.
          schema:
            type: string
        - in: query
          name: firstBin
          description: First FFT magnitude bin to include.
          schema:
            type: integer
            minimum: 0
        - in: query
          name: binCount
          description: Number of FFT magnitude bins to include; zero means all remaining bins.
          schema:
            type: integer
            minimum: 0
        - in: query
          name: cadenceMs
          description: Minimum presentation interval between emitted units; zero preserves every unit.
          schema:
            type: integer
            minimum: 0
        - in: query
          name: history
          description: Number of retained historical units to prepend, capped at 4096.
          schema:
            type: integer
            minimum: 0
            maximum: 4096
        - in: query
          name: format
          schema:
            type: string
            enum: [ndjson]
      responses:
        "200":
          description: Newline-delimited DataUnit objects with blank-line heartbeats
          headers:
            X-PAMGuard-Block-Id:
              schema:
                type: string
            X-PAMGuard-Graph-Revision:
              schema:
                type: integer
          content:
            application/x-ndjson:
              schema:
                $ref: "#/components/schemas/DataUnit"
        "401":
          description: Unauthorized
        "404":
          description: Unknown data block
  /data-blocks/{blockId}/history:
    get:
      summary: Read the bounded recent history of one typed data block
      description: Returns the newest retained units, oldest first. The optional limit is capped at 4096.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - in: path
          name: blockId
          required: true
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 0
            maximum: 4096
      responses:
        "200":
          description: Retained data units and current block health counters
          content:
            application/json:
              schema:
                type: object
                required: [blockId, graphRevision, units, count, stats]
                properties:
                  blockId:
                    type: string
                  graphRevision:
                    type: integer
                  units:
                    type: array
                    items:
                      $ref: "#/components/schemas/DataUnit"
                  count:
                    type: integer
                  stats:
                    $ref: "#/components/schemas/DataBlockStats"
        "400":
          description: Invalid limit
        "401":
          description: Unauthorized
        "404":
          description: Unknown data block
  /data-blocks/{blockId}/audio-f32le:
    get:
      summary: Stream selected raw-audio channels as binary float PCM
      description: >-
        Streams interleaved little-endian float32 PCM directly from a playable
        raw-audio block. Presentation delivery is bounded and drop-oldest, so
        playback cannot block scientific processing. Response headers declare
        the sample rate, selected channel count, block identity, and framing.
        The default raw format is unframed PCM. The framed format emits one or
        more PGA1 packets: 40 little-endian header bytes (magic, header size,
        channels, frames, Unix time ms, start sample, cumulative dropped
        transport frames) followed by interleaved float32 samples.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - in: path
          name: blockId
          required: true
          schema:
            type: string
        - in: query
          name: channels
          description: Comma-separated physical source channel indices; defaults to all available channels.
          schema:
            type: string
            example: "0,1"
        - in: query
          name: format
          description: Raw PCM compatibility stream or timestamped/drop-aware PGA1 packets.
          schema:
            type: string
            enum: [raw, framed]
            default: raw
      responses:
        "200":
          description: Interleaved binary float32 PCM
          headers:
            X-PAMGuard-Block-Id:
              schema:
                type: string
            X-PAMGuard-Sample-Rate-Hz:
              schema:
                type: number
            X-PAMGuard-Channel-Count:
              schema:
                type: integer
            X-PAMGuard-Channels:
              schema:
                type: string
            X-PAMGuard-Audio-Framing:
              schema:
                type: string
                enum: [raw, pga1]
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/vnd.pamguard.audio-f32le:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid or unavailable channel selection
        "401":
          description: Unauthorized
        "404":
          description: Unknown or non-playable data block
  /workspaces:
    get:
      summary: List legacy operator workspaces
      description: >-
        Deprecated compatibility view. Project-owned display hierarchy and
        layout are exposed by /v1/projects/active. Legacy persistence is
        loaded and this route is available only when
