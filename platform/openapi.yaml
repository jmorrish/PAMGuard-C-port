      tags: [Compatibility]
      deprecated: true
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Saved workspace layout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceLayout"
        "400":
          description: Invalid workspace ID
        "401":
