              name:
                type: string
                maxLength: 256
              sourceBlockId:
                type: string
                maxLength: 512
            additionalProperties: true
    OperatorEventInput:
      type: object
      required: [label]
      properties:
        category:
          type: string
          maxLength: 128
          description: Optional; the module's configured default is used when omitted.
        label:
          type: string
          minLength: 1
          maxLength: 512
        notes:
          type: string
          maxLength: 8192
        value:
          type: number
        timeMs:
          type: integer
          format: int64
          description: Unix milliseconds; zero or omission uses service time.
        startSample:
          type: integer
          format: int64
    DataUnit:
      type: object
      required: [typeId, schemaVersion, sourceBlockId, uid, sequence, timeMs, startSample, durationSamples, channelBitmap, sequenceBitmap, clockDomainId, discontinuity, payload]
      properties:
        typeId:
          type: string
        schemaVersion:
          type: integer
        sourceBlockId:
          type: string
        uid:
          type: integer
        sequence:
          type: integer
        timeMs:
          type: integer
          format: int64
        startSample:
          type: integer
          format: int64
        durationSamples:
          type: integer
        channelBitmap:
          type: integer
        sequenceBitmap:
          type: integer
        clockDomainId:
          type: string
        discontinuity:
          type: boolean
        payload:
          oneOf:
            - type: object
              description: Raw-audio payload with sampleRateHz, channelCount, and interleavedPcm.
              additionalProperties: true
            - type: object
              description: FFT payload with channel, fftSlice, and magnitudeSquared.
              additionalProperties: true
            - type: object
              description: Detection, level, recording, alarm, operator-event, or storage-health payload.
              additionalProperties: true
            - type: "null"
    EngineSessionCreate:
      type: object
      required: [sessionId, sampleRateHz, channelCount]
      properties:
        sessionId:
          type: string
          pattern: "^[A-Za-z0-9_.-]+$"
        sourceId:
          type: string
        ownerId:
          type: string
          description: Web-tier/user ownership tag; optional by schema, but required when PAMGUARD_REQUIRE_SESSION_METADATA is enabled.
        tenantId:
          type: string
          description: Tenant/project ownership tag; optional by schema, but required when PAMGUARD_REQUIRE_SESSION_METADATA is enabled.
        sampleRateHz:
          type: integer
          minimum: 1
        channelCount:
          type: integer
          minimum: 1
          maximum: 1024
        fft:
          type: object
          properties:
            length:
              type: integer
              minimum: 1
              description: Must be a power of two.
            hop:
              type: integer
              minimum: 1
              description: Must be less than or equal to fft.length.
            windowType:
              oneOf:
                - type: string
                  enum: [Rectangular, Hamming, Hann, Bartlett, Blackman, Blackman-Harris]
                - type: integer
            channels:
              type: array
              items:
                type: integer
                minimum: 0
        array:
          type: object
          properties:
            id:
              type: string
            speedOfSoundMps:
              type: number
              exclusiveMinimum: 0
            speedOfSoundErrorMps:
              type: number
              minimum: 0
              description: Sound speed uncertainty used by the pair bearing error estimate.
            timingErrorSeconds:
              type: number
              minimum: 0
              description: Delay timing uncertainty used by the pair bearing error estimate.
            spacingErrorM:
              type: number
              minimum: 0
              description: Hydrophone spacing uncertainty used by the pair bearing error estimate.
            wobbleRadians:
              type: number
              minimum: 0
              description: Pair axis wobble term used by the pair bearing error estimate.
            streamers:
              type: array
              description: Towed or moored streamers. A hydrophone's absolute position is its own coordinates plus its streamer's, matching PamArray.getAbsHydrophoneVector, which translates only.
              items:
                type: object
                required:
                  - id
                properties:
                  id:
                    type: integer
                  xM:
                    type: number
                  yM:
                    type: number
                  zM:
                    type: number
                  headingDegrees:
                    type: number
                    description: >-
                      Streamer heading in degrees. Hydrophone coordinates are rotated by the
                      streamer's heading/pitch/roll quaternion before the streamer position is
                      added, as PAMGuard's HydrophoneLocator.getPhoneLatLong does. Positive
                      heading turns clockwise. Defaults to 0.
                  pitchDegrees:
                    type: number
                    description: Streamer pitch in degrees, applied with headingDegrees and rollDegrees. Defaults to 0.
                  rollDegrees:
                    type: number
                    description: Streamer roll in degrees, applied with headingDegrees and pitchDegrees. Defaults to 0.
            orientation:
              type: object
              description: >-
                The whole array's orientation in the world (PAMGuard reads this from GPS as
                GpsData.getQuaternion). Declaring it adds earth-frame direction vectors to
                bearing outputs; leaving it out leaves directions in the array frame with no
                earth-frame fields, rather than silently passing array-frame values off under
                an earth-frame name. Same clockwise-heading convention as streamer orientation.
                Distinct from streamers[].headingDegrees, which orients streamers WITHIN the
                array frame.
              properties:
                headingDegrees:
                  type: number
                pitchDegrees:
                  type: number
                rollDegrees:
                  type: number
            hydrophones:
              type: array
              items:
                type: object
                properties:
                  channel:
                    type: integer
                  xM:
                    type: number
                    description: Relative to the hydrophone's streamer origin when streamers are declared.
                  yM:
                    type: number
                  zM:
                    type: number
                  sensitivityDb:
                    type: number
                  streamerId:
                    type: integer
                    description: Must match a declared streamer when any are declared. Also scopes duplicate-position detection in array shape maths.
                  xErrorM:
                    type: number
                    minimum: 0
                    description: >-
                      Per-axis position uncertainty (PAMGuard Hydrophone.getCoordinateErrors), used by
                      the ML grid bearing localiser to weight each grid bin. Defaults to 0, which
                      treats the position as exact; the localiser still runs as long as
                      timingErrorSeconds or speedOfSoundErrorMps is positive.
                  yErrorM:
                    type: number
                    minimum: 0
                    description: Per-axis position uncertainty; see xErrorM.
                  zErrorM:
                    type: number
                    minimum: 0
                    description: Per-axis position uncertainty; see xErrorM.
            clickLocalisationReadiness:
              type: object
              properties:
                enabled:
                  type: boolean
                mode:
                  type: string
                  enum:
                    - disabled
                    - invalid-click-channel-count
                    - geometry-constrained
                    - partial-geometry
                    - delay-only-unconstrained
                geometryComplete:
                  type: boolean
                bearingEnabled:
                  type: boolean
                delayLimitMode:
                  type: string
                  enum:
                    - geometry-constrained
                    - unconstrained
                clickChannels:
                  type: array
                  items:
                    type: integer
                hydrophoneChannels:
                  type: array
                  items:
                    type: integer
                matchedClickHydrophoneChannels:
                  type: array
                  items:
                    type: integer
                missingClickHydrophoneChannels:
                  type: array
                  items:
                    type: integer
        fftNoise:
          type: object
          description: PAMGuard noiseMonitor FFT-band interval statistics.
          properties:
            enabled:
              type: boolean
              default: false
            channelBitmap:
              type: integer
              minimum: 1
              default: 1
            measurementIntervalSeconds:
              type: integer
              minimum: 1
              default: 60
            nMeasures:
              type: integer
              minimum: 1
              default: 100
            useAll:
              type: boolean
              default: true
            bands:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/FftNoiseBand"
        acquisition:
          type: object
          description: Acquisition calibration used by calibrated noise outputs.
          properties:
            voltsPeak2Peak:
              type: number
              exclusiveMinimum: 0
            preampGainDb:
              type: number
        noiseBand:
          type: object
          description: PAMGuard noiseBandMonitor fractional-octave IIR filter bank.
          properties:
            enabled:
              type: boolean
              default: false
            bandType:
              type: string
              enum: [octave, thirdOctave, decidecade, decade, tenthOctave, twelfthOctave]
              default: thirdOctave
            minFrequencyHz:
              type: number
              exclusiveMinimum: 0
            maxFrequencyHz:
              type: number
              minimum: 0
              description: Zero keeps the module default upper frequency.
            referenceFrequencyHz:
              type: number
              exclusiveMinimum: 0
              default: 1000
            iirOrder:
              type: integer
              minimum: 1
              default: 6
            outputIntervalSeconds:
              type: number
              exclusiveMinimum: 0
              default: 5
        ltsa:
          type: object
          description: PAMGuard long-term spectral average over the configured FFT stream.
          properties:
            enabled:
              type: boolean
              default: false
            intervalSeconds:
              type: integer
              minimum: 1
              default: 10
        ishmael:
          $ref: "#/components/schemas/IshmaelDetectorConfig"
        sgramCorr:
          type: object
          description: PAMGuard Ishmael spectrogram-correlation detector.
          properties:
            enabled:
              type: boolean
              default: false
            segments:
              type: array
              minItems: 1
              items:
                type: array
                minItems: 4
                maxItems: 4
                items:
                  type: number
              description: Each segment is [startSeconds, startHz, endSeconds, endHz].
            spread:
              type: number
              exclusiveMinimum: 0
            useLog:
              type: boolean
            thresh:
              type: number
            minTimeSeconds:
              type: number
              minimum: 0
            maxTimeSeconds:
              type: number
              minimum: 0
            refractoryTimeSeconds:
              type: number
              minimum: 0
        matchFilt:
          type: object
          description: PAMGuard Ishmael time-domain matched-filter detector.
          properties:
            enabled:
              type: boolean
              default: false
            kernel:
              type: array
              minItems: 1
              items:
                type: number
            channels:
              type: array
              items:
                type: integer
                minimum: 0
            thresh:
              type: number
            minTimeSeconds:
              type: number
              minimum: 0
            maxTimeSeconds:
              type: number
              minimum: 0
            refractoryTimeSeconds:
              type: number
              minimum: 0
        matchedTemplate:
          $ref: "#/components/schemas/MatchedTemplateSessionConfig"
        click:
          type: object
          properties:
            enabled:
              type: boolean
            localisation:
              type: boolean
            angleVetoes:
              type: array
              description: >
                PAMGuard Detector Vetoes. A click is rejected when the absolute
                legacy first-pair bearing is inclusively inside any range. The
                channels bitmap is preserved but PAMGuard currently ignores it.
                The default is an empty array.
              items:
                $ref: "#/components/schemas/ClickAngleVeto"
            thresholdDb:
              type: number
            channelBitmap:
              type: integer
            triggerBitmap:
              type: integer
            minTriggerChannels:
              type: integer
            shortFilter:
              type: number
            longFilter:
              type: number
            preSample:
              type: integer
            postSample:
              type: integer
            minSep:
              type: integer
            maxLength:
              type: integer
            featuresEnabled:
              type: boolean
            features:
              type: object
              properties:
                fftLength:
                  type: integer
                  description: Click feature FFT length; zero or omitted follows the session FFT length.
                lengthEnergyFraction:
                  type: number
                widthEnergyFraction:
                  type: number
                energyBandsHz:
                  type: array
                  items:
                    type: array
                    items:
                      type: number
                peakFrequencySearchHz:
                  type: array
                  items:
                    type: number
                meanFrequencyRangeHz:
                  type: array
                  items:
                    type: number
            classifier:
              type: object
              description: PAMGuard click classifier selection and settings.
              properties:
                type:
                  type: string
                  enum: [basic, sweep, none]
                  default: sweep
                runOnline:
                  type: boolean
                  default: false
                discardUnclassifiedClicks:
                  type: boolean
                  default: false
                basic:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    standardTypes:
                      type: array
                      items:
                        oneOf:
                          - type: string
                            enum: [beakedWhale, porpoise]
                          - type: object
                            properties:
                              standard:
                                type: string
                                enum: [beakedWhale, porpoise]
                              speciesCode:
                                type: integer
                              discard:
                                type: boolean
                              whichSelections:
                                type: integer
                    types:
                      type: array
                      items:
                        type: object
                        additionalProperties: true
                sweep:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    checkAllClassifiers:
                      type: boolean
                      default: false
                    standardTypes:
                      type: array
                      items:
                        oneOf:
                          - type: string
                            enum: [beakedWhale, porpoise]
                          - type: object
                            properties:
                              standard:
                                type: string
                                enum: [beakedWhale, porpoise]
                              speciesCode:
                                type: integer
                              name:
                                type: string
                              discard:
                                type: boolean
                              enabled:
                                type: boolean
                    types:
                      type: array
                      items:
                        $ref: "#/components/schemas/SweepClickType"
            basicClassifier:
              type: object
              deprecated: true
              description: Deprecated documentation alias; use click.classifier.basic.
              properties:
                enabled:
                  type: boolean
                standardTypes:
                  type: array
                  items:
                    oneOf:
                      - type: string
                        enum: [beakedWhale, porpoise]
                      - type: object
                        properties:
                          standard:
                            type: string
                            enum: [beakedWhale, porpoise]
                          speciesCode:
                            type: integer
                          discard:
                            type: boolean
                          whichSelections:
                            type: integer
            train:
              type: object
              properties:
                enabled:
                  type: boolean
                algorithm:
                  type: string
                  enum:
                    - ici
                    - mht
                  description: Click train former. "ici" is the max-ICI/min-clicks tracker; "mht" is the ported PAMGuard MHT stack (kernel plus StandardMHTChi2 with IDI/amplitude/length variables).
                maxIciSeconds:
                  type: number
                minIciSeconds:
                  type: number
                  minimum: 0
                minClicks:
                  type: integer
                classifier:
                  type: object
                  description: PAMGuard click train classifier chain, applied to MHT trains. The chi2 pre-classifier gates first; a rejection marks the train junk. Remaining classifiers all run, with the first returning a species setting the result.
                  properties:
                    enabled:
                      type: boolean
                    preClassifier:
                      type: object
                      properties:
                        chi2Threshold:
                          type: number
                          description: Zero disables the chi2 test entirely, as in PAMGuard.
                        minClicks:
                          type: integer
                        minTimeSeconds:
                          type: number
                        speciesFlag:
                          type: integer
                    idi:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                        useMedianIdi:
                          type: boolean
                        minMedianIdi:
                          type: number
                        maxMedianIdi:
                          type: number
                        useMeanIdi:
                          type: boolean
                        minMeanIdi:
                          type: number
                        maxMeanIdi:
                          type: number
                        useStdIdi:
                          type: boolean
                        minStdIdi:
                          type: number
                        maxStdIdi:
                          type: number
                        speciesFlag:
                          type: integer
                    bearing:
                      type: object
                      description: Bearing-domain train classifier using the same mean, median, and standard-deviation derivative gates as PAMGuard.
                      properties:
                        enabled:
                          type: boolean
                        bearingLimMinDegrees:
                          type: number
                        bearingLimMaxDegrees:
                          type: number
                        useMean:
                          type: boolean
                        minMeanBearingDerivativeDegrees:
                          type: number
                        maxMeanBearingDerivativeDegrees:
                          type: number
                        useMedian:
                          type: boolean
                        minMedianBearingDerivativeDegrees:
                          type: number
                        maxMedianBearingDerivativeDegrees:
                          type: number
                        useStd:
                          type: boolean
                        minStdBearingDerivativeDegrees:
                          type: number
                        maxStdBearingDerivativeDegrees:
                          type: number
                        speciesFlag:
                          type: integer
                    template:
                      type: object
                      description: Spectrum template classifier. Supply either a PAMGuard preset name or an explicit spectrum with its sampleRateHz.
                      properties:
                        enabled:
                          type: boolean
                        preset:
                          type: string
                          enum:
                            - Sperm Whale
                            - Broadband Dolphin
                            - Beaked Whale
                            - NBHF
                            - Boat
                          description: PAMGuard default templates; note the PAMGuard source marks these values as provisional.
                        spectrum:
                          type: array
                          items:
                            type: number
                        sampleRateHz:
                          type: number
                        correlationThreshold:
                          type: number
                        speciesFlag:
                          type: integer
                mht:
                  type: object
                  description: MHT tuning, honoured only when algorithm is "mht". Omitted fields keep PAMGuard defaults. At least one chi2 variable must stay enabled.
                  properties:
                    enableIdi:
                      type: boolean
                    enableAmplitude:
                      type: boolean
                    enableLength:
                      type: boolean
                    enableBearing:
                      type: boolean
                      description: Requires click localisation so per-click bearings exist.
                    enablePeakFrequency:
                      type: boolean
                      description: Requires click features so per-click peak frequency exists.
                    enableTimeDelay:
                      type: boolean
                      description: Requires click localisation so per-click pair delays exist. Contributes nothing for two-hydrophone arrays, where its drop-the-worst-pair rule removes the only term.
                    enableCorrelation:
                      type: boolean
                      description: Correlates consecutive in-track click waveforms on demand; requires the click detector to retain waveforms.
                    coastPenalty:
                      type: number
                      minimum: 0
                    newTrackPenalty:
                      type: number
                      minimum: 0
                    newTrackN:
                      type: integer
                    maxIci:
                      type: number
                      exclusiveMinimum: 0
                    lowIciExponent:
                      type: number
                    longTrackExponent:
                      type: number
                    useElectricalNoiseFilter:
                      type: boolean
                      description: Flags tracks whose error-independent chi2 falls below electricalNoiseMinChi2 as junk (too uniform to be biological), confirming them out of the possibility mix.
                    electricalNoiseMinChi2:
                      type: number
                    electricalNoiseNDataUnits:
                      type: integer
                      description: Minimum detections in a track before the noise filter engages.
                    nHold:
                      type: integer
                      minimum: 1
                    nPruneback:
                      type: integer
                      minimum: 1
                    nPrunebackStart:
                      type: integer
                    maxCoast:
                      type: integer
                      minimum: 1
        whistle:
          type: object
          properties:
            enabled:
              type: boolean
              description: Enables the legacy whistleDetector BetterPeakDetector output; Whistles & Moans contours do not depend on it.
            regionEnabled:
              type: boolean
              description: Enables the whistlesAndMoans connected-region detector.
            channelBitmap:
              type: integer
              minimum: 1
              description: Selected FFT source channels for Whistles & Moans.
            groupingType:
              type: string
              enum: [all, singles, user]
              default: all
              description: PAMGuard GroupedSourceParameters grouping mode.
            channelGroups:
              type: array
              description: Group number by audio channel; required for user grouping.
              items:
                type: integer
                minimum: 0
                maximum: 31
            detectionThresholdDb:
              type: number
            peakTimeConstant0:
              type: number
            peakTimeConstant1:
              type: number
            maxPercentOverThreshold:
              type: number
            minPeakWidth:
              type: integer
            maxPeakWidth:
              type: integer
            searchBin0:
              type: integer
            searchBin1:
              type: integer
            warmupSlices:
              type: integer
            minFrequencyHz:
              type: number
              description: WhistlesAndMoans lower search frequency, converted to a bin with Java's truncation and clamp rules.
            maxFrequencyHz:
              type: number
              description: WhistlesAndMoans upper search frequency; values <= 0 or >= Nyquist select Nyquist, matching Java's getter.
            backgroundIntervalSeconds:
              type: number
              exclusiveMinimum: 0
              default: 10
