        historyCapacity:
          type: integer
        oldestTimeMs:
          type:
            - integer
            - "null"
          format: int64
        latestTimeMs:
          type:
            - integer
            - "null"
          format: int64
        oldestStartSample:
          type:
            - integer
            - "null"
          format: int64
        latestStartSample:
          type:
            - integer
            - "null"
          format: int64
        clockDomainId:
          type: string
        retentionPolicy:
          type: string
        persistenceProviders:
          type: array
          items:
            type: string
        exportProviders:
          type: array
          items:
            type: string
