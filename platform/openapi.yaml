      properties:
        published:
          type: integer
        delivered:
          type: integer
        dropped:
          type: integer
        observerErrors:
          type: integer
        subscriberCount:
          type: integer
        historySize:
          type: integer
        queuedUnits:
          type: integer
        maximumQueuedUnits:
          type: integer
    WorkspaceSummary:
      type: object
      required: [id, name, updatedTimeMs, displayCount]
      properties:
        id:
          type: string
        name:
          type: string
          maxLength: 256
        updatedTimeMs:
          type: integer
          format: int64
        displayCount:
          type: integer
    WorkspaceLayout:
      type: object
      required: [schemaVersion, displays]
      properties:
        id:
          type: string
        schemaVersion:
