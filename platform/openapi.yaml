                    type: string
                  count:
                    type: integer
                  limit:
                    type: integer
                  indexed:
                    type: boolean
                    description: True when the service answered the detection archive query through the detector-event sidecar index; false means it fell back to raw sidecar/archive scanning.
                  cursor:
                    type:
                      - integer
                      - "null"
                  nextCursor:
                    type:
                      - integer
                      - "null"
                  type:
                    type:
                      - string
                      - "null"
                  sourceId:
                    type:
                      - string
                      - "null"
                  ownerId:
                    type:
                      - string
                      - "null"
                  tenantId:
                    type:
                      - string
                      - "null"
                  startSampleFrom:
                    type:
                      - integer
                      - "null"
                  startSampleTo:
                    type:
                      - integer
                      - "null"
                  overlapStartSample:
                    type:
                      - integer
                      - "null"
                  overlapEndSample:
                    type:
                      - integer
                      - "null"
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/DetectionEvent"
