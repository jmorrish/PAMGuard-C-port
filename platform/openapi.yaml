                type: object
                description: >-
                  PAMGuard MLGridBearingLocaliser2 output — the localiser bearingLocaliser names.
                  Present when the sub-array's shape selects "grid" and the solve succeeds.
                  Theta and phi are the reference's own angles in the sub-array's principal axis
                  frame, NOT compass azimuth and elevation; converting them would need an array
                  orientation the engine does not have. Compare lsqBearing, which does report
                  azimuth and elevation because it solves in the hydrophone coordinate frame.
                properties:
                  thetaRadians:
                    type: number
                  thetaDegrees:
                    type: number
                  thetaErrorRadians:
                    type: number
                    description: Curvature-based error estimate; omitted when non-finite.
                  phiRadians:
                    type: number
                    description: Present only when hasPhi is true.
                  phiDegrees:
                    type: number
                  phiErrorRadians:
                    type: number
                  hasPhi:
                    type: boolean
                    description: False for a line sub-array, where the reference returns theta alone.
                  usedPairs:
                    type: integer
                  worldVectors:
                    type: array
                    description: >-
                      The same direction as unit vectors in the hydrophone array's own xyz frame
                      (PAMGuard AbstractLocalisation.getWorldVectors). NOT an earth frame: reaching
                      a compass direction needs a further rotation by vessel course, pitch, and roll.
                      One entry for a volume sub-array; two for a plane (either side of the array
                      plane) or a line (left/right).
                    items:
                      type: object
                      properties:
                        x:
                          type: number
                        y:
                          type: number
                        z:
                          type: number
                        cone:
                          type: boolean
                          description: >-
                            True when the vector describes a surface of possible directions rather
                            than one direction, as for a line sub-array's bearing cone. Set only on
                            the line branch, matching the reference.
                  earthWorldVectors:
                    type: array
                    description: worldVectors rotated into the earth frame by array.orientation; present only when declared.
                    items:
                      type: object
                      properties:
                        x:
                          type: number
                        y:
                          type: number
                        z:
                          type: number
