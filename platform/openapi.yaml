  /assets/{assetPath}:
    get:
      summary: Get a confined web UI asset
      description: >-
        Serves a regular file from the explicitly configured
        PAMGUARD_WEB_ASSET_DIR, or from the validated assets directory beside
        PAMGUARD_WEB_UI_FILE when no explicit directory is set. assetPath may
        include nested slash-separated directories. Paths are URL-decoded,
        structurally validated, canonicalized, confined after symlink
        resolution, and restricted to an explicit MIME allowlist. This is not
        a general filesystem or static-directory route.
      parameters:
        - in: path
          name: assetPath
          required: true
          schema:
            type: string
          description: Relative path below the configured web assets root.
      responses:
        "200":
          description: Web asset with an extension-specific Content-Type
          headers:
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
        "403":
          description: Traversal, encoded traversal, or symlink escape
        "404":
          description: Asset serving is disabled or the regular file is absent
        "415":
          description: File extension is not in the web asset MIME allowlist
