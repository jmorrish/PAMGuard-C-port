components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
  headers:
    ProjectETag:
      description: Strong opaque active- or durable-project concurrency token. Preserve the surrounding quotes and send the value unchanged in If-Match.
      schema:
        type: string
        pattern: '^"pgp1-[A-Za-z0-9_-]{43}"$'
  parameters:
    ProjectId:
      in: path
      name: projectId
      required: true
      description: Lowercase RFC 4122 UUIDv4 project identity.
      schema:
        $ref: "#/components/schemas/ProjectUuid"
    ProjectIfMatch:
      in: header
      name: If-Match
      required: true
      description: Exact strong ETag from the most recent active-project response. Wildcards and weak validators are not accepted.
      schema:
        type: string
        pattern: '^"pgp1-[A-Za-z0-9_-]{43}"$'
    AcquisitionUnitId:
      in: path
      name: acquisitionUnitId
      required: true
      description: Stable ID of an active controlled unit whose exact type is pamguard.acquisition.
      schema:
        $ref: "#/components/schemas/ProjectUuid"
    ExpectedProjectIdQuery:
      in: query
      name: expectedProjectId
      required: true
      description: >-
        Exact stable project ID from the latest active-project/Acquisition read. The request is
        rejected before ingest if another project is active.
      schema:
        $ref: "#/components/schemas/ProjectUuid"
    SoundRecorderUnitId:
      in: path
      name: soundRecorderUnitId
      required: true
      description: Stable ID of an active controlled unit whose exact type is pamguard.sound-recorder.
      schema:
        $ref: "#/components/schemas/ProjectUuid"
    ClickDetectorUnitId:
      in: path
      name: clickDetectorUnitId
      required: true
      description: Stable ID of an active controlled unit whose exact type is pamguard.click-detector.
      schema:
        $ref: "#/components/schemas/ProjectUuid"
    TrackedEventId:
      in: path
      name: trackedEventId
      required: true
      description: Positive manual tracked-event identity within one retained Click Detector runtime.
      schema:
        type: integer
        format: uint64
        minimum: 1
    ExpectedAcquisitionWorkingRevisionQuery:
      in: query
      name: expectedWorkingRevision
      required: true
      description: >-
        Exact working revision from the latest active-project/Acquisition read. The request is
        rejected before ingest if the project has changed.
      schema:
        type: integer
        format: int64
        minimum: 0
  responses:
    ProjectPreconditionRequired:
      description: A strong If-Match active-project ETag is required
      headers:
        ETag:
          $ref: "#/components/headers/ProjectETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProjectError"
    ProjectPreconditionFailed:
      description: If-Match is stale or does not identify the current active-project state
      headers:
        ETag:
          $ref: "#/components/headers/ProjectETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProjectError"
  schemas:
    ProjectUuid:
      type: string
      format: uuid
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
    ProjectEntityId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$"
    ProjectRoleId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: "^[a-z][A-Za-z0-9]*$"
    ProjectContentHash:
      type: string
      description: sha256-prefixed lowercase digest of canonical project content.
      pattern: "^sha256:[0-9a-f]{64}$"
    ProjectError:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
        currentEtag:
          type: string
          pattern: '^"pgp1-[A-Za-z0-9_-]{43}"$'
      additionalProperties: false
    ProjectAuthorityRequiredError:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
          const: project_authority_required
      additionalProperties: false
    TrackedClickLocator:
      type: object
      required: [uid, startSample, channelBitmap]
      properties:
        uid:
          type: integer
          format: uint64
          minimum: 1
        startSample:
          type: integer
          format: int64
        channelBitmap:
          type: integer
          format: uint32
          minimum: 1
          maximum: 4294967295
      additionalProperties: false
    TrackedClickObservation:
      allOf:
        - $ref: "#/components/schemas/TrackedClickLocator"
        - type: object
          required:
            - timeMs
            - bearingRadians
            - originMetres
            - headingRadians
            - earthBearingAmbiguitiesRadians
            - navigationReferenceId
          properties:
            timeMs:
              type: integer
              format: int64
            bearingRadians:
              type:
                - number
                - "null"
            originMetres:
              type:
                - array
                - "null"
              minItems: 3
              maxItems: 3
              items:
                type: number
              description: Local east, north, and height coordinates captured at click trigger onset.
            headingRadians:
              type:
                - number
                - "null"
              description: Time-specific array heading clockwise from north.
            earthBearingAmbiguitiesRadians:
              type: array
              items:
                type: number
            navigationReferenceId:
              type:
                - string
                - "null"
              description: Stable Acquisition/navigation-frame identity; never a generated runtime ID.
      unevaluatedProperties: false
    TrackedClickLocaliserSettings:
      type: object
      description: >-
        Portable normalization of ClickLocParams. isSelected follows GeneralGroupLocaliser
        ordering: Least Squares, 2D Simplex, 3D Simplex, MCMC.
      required:
        - isSelected
        - maxRangeM
        - maxHeightM
        - minHeightM
        - maxTimeMilliseconds
        - limitPoints
        - maxPoints
      properties:
        isSelected:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: boolean
        maxRangeM:
          type: number
          exclusiveMinimum: 0
        maxHeightM:
          type: number
        minHeightM:
          type: number
        maxTimeMilliseconds:
          type: integer
          format: uint64
          minimum: 0
        limitPoints:
          type: boolean
        maxPoints:
          type: integer
          minimum: 1
      additionalProperties: false
    TrackedClickAlgorithmAvailability:
      type: object
      required:
        - javaIndex
        - id
        - javaName
        - selected
        - available
        - unavailableReason
      properties:
        javaIndex:
          type: integer
          minimum: 0
          maximum: 3
        id:
          type: string
          enum: [least-squares, simplex-2d, simplex-3d, mcmc]
        javaName:
          type: string
        selected:
          type: boolean
        available:
          type: boolean
        unavailableReason:
          type:
            - string
            - "null"
      additionalProperties: false
    TrackedClickLocalisationAssessment:
      type: object
      required: [status, available, code, message, algorithms]
      properties:
        status:
          type: string
          enum:
            - available
            - notEnoughClicks
            - noAlgorithmSelected
            - missingBearing
            - movingArrayOriginUnavailable
            - timeDelayOriginUnavailable
            - runModeUnavailable
            - selectedAlgorithmUnavailable
        available:
          type: boolean
        code:
          type: string
        message:
          type: string
        algorithms:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: "#/components/schemas/TrackedClickAlgorithmAvailability"
      additionalProperties: false
    TrackedTargetMotionFit:
      type: object
      required:
        - status
        - succeeded
        - positionMetres
        - rawChi2
        - reducedChi2
        - aic
        - perpendicularErrorMetres
        - parallelErrorMetres
        - errorAngleRadians
        - referenceObservationIndex
        - selectedObservationIndices
      properties:
        status:
          type: string
          enum:
            - success
            - invalid_point_limit
            - non_finite_input
            - no_observations
            - degenerate_fit
            - non_convergent_bearings
        succeeded:
          type: boolean
        positionMetres:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type:
              - number
              - "null"
        rawChi2:
          type: [number, "null"]
        reducedChi2:
          type: [number, "null"]
        aic:
          type: [number, "null"]
        perpendicularErrorMetres:
          type: [number, "null"]
        parallelErrorMetres:
          type: [number, "null"]
        errorAngleRadians:
          type: [number, "null"]
        referenceObservationIndex:
          type: [integer, "null"]
          minimum: 0
        selectedObservationIndices:
          type: array
          items:
            type: integer
            minimum: 0
      additionalProperties: false
    TrackedTargetMotionFilterInput:
      type:
        - object
        - "null"
      properties:
        perpendicularDistanceMetres:
          type: [number, "null"]
        heightMetres:
          type: [number, "null"]
      required: [perpendicularDistanceMetres, heightMetres]
      additionalProperties: false
    TrackedTargetMotionFilterAssessment:
      type:
        - object
        - "null"
      properties:
        passesRunawayGuard:
          type: boolean
        passesConfiguredLimits:
          type: boolean
        accepted:
          type: boolean
      required: [passesRunawayGuard, passesConfiguredLimits, accepted]
      additionalProperties: false
    TrackedClickAmbiguityLocalisationResult:
      type: object
      required:
        - ambiguityIndex
        - accepted
        - fit
        - beamSampleTimeMs
        - beamDistanceMetres
        - filterInput
        - filterAssessment
      properties:
        ambiguityIndex:
          type: integer
          minimum: 0
        accepted:
          type: boolean
        fit:
          $ref: "#/components/schemas/TrackedTargetMotionFit"
        beamSampleTimeMs:
          type: [integer, "null"]
          format: int64
        beamDistanceMetres:
          type: [number, "null"]
          minimum: 0
        filterInput:
          $ref: "#/components/schemas/TrackedTargetMotionFilterInput"
        filterAssessment:
          $ref: "#/components/schemas/TrackedTargetMotionFilterAssessment"
      additionalProperties: false
    TrackedClickLocalisationRun:
      type: object
      required:
        - status
        - executed
        - accepted
        - code
        - message
        - assessment
        - ambiguities
      properties:
        status:
          type: string
          enum: [assessmentUnavailable, navigationTrackUnavailable, executed]
        executed:
          type: boolean
        accepted:
          type: boolean
        code:
          type: string
        message:
          type: string
        assessment:
          $ref: "#/components/schemas/TrackedClickLocalisationAssessment"
        ambiguities:
          type: array
          items:
            $ref: "#/components/schemas/TrackedClickAmbiguityLocalisationResult"
      additionalProperties: false
    TrackedClickEvent:
      type: object
      required:
        - eventId
        - comment
        - clickCount
        - startTimeMs
        - endTimeMs
        - clicks
        - localisation
      properties:
        eventId:
          type: integer
          format: uint64
          minimum: 1
        comment:
          type: string
          const: Manual Click Train Detection
        clickCount:
          type: integer
          minimum: 1
        startTimeMs:
          type: integer
          format: int64
        endTimeMs:
          type: integer
          format: int64
        clicks:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TrackedClickObservation"
        localisation:
          $ref: "#/components/schemas/TrackedClickLocalisationAssessment"
      additionalProperties: false
    TrackedClickEventList:
      type: object
      required:
        - schemaVersion
        - projectId
        - workingRevision
        - clickDetectorUnitId
        - sourceBlockId
        - runtimeRunning
        - persistence
        - settings
        - events
      properties:
        schemaVersion:
          type: integer
          const: 1
        projectId:
          $ref: "#/components/schemas/ProjectUuid"
        workingRevision:
          type: integer
          format: uint64
          minimum: 1
        clickDetectorUnitId:
          $ref: "#/components/schemas/ProjectUuid"
        sourceBlockId:
          type:
            - string
            - "null"
        runtimeRunning:
          type: boolean
        persistence:
          type: string
          const: retained-runtime-data
        settings:
          $ref: "#/components/schemas/TrackedClickLocaliserSettings"
        events:
          type: array
          items:
            $ref: "#/components/schemas/TrackedClickEvent"
      additionalProperties: false
    AssignTrackedClicksRequest:
      type: object
      required: [clicks, eventId]
      properties:
        clicks:
          type: array
          minItems: 1
          maxItems: 4096
          items:
            $ref: "#/components/schemas/TrackedClickLocator"
        eventId:
          type:
            - integer
            - "null"
          format: uint64
          minimum: 1
      additionalProperties: false
    ReassignTrackedEventRequest:
      type: object
      required: [targetEventId]
      properties:
        targetEventId:
          type: integer
          format: uint64
          minimum: 1
      additionalProperties: false
    AcquisitionOperatorError:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
        requestedWorkingRevision:
          type: integer
          format: int64
          minimum: 0
        currentWorkingRevision:
          type: integer
          format: int64
          minimum: 0
        expectedBindingRevision:
          type: integer
          format: int64
          minimum: 0
        currentBindingRevision:
          type:
            - integer
            - "null"
          format: int64
          minimum: 1
        maxPcmBodyBytes:
          type: integer
          format: int64
          minimum: 1
      additionalProperties: false
    ActiveAcquisitionSummary:
      type: object
      required:
        - unitId
        - name
        - typeId
        - sampleRateHz
        - channelCount
        - hostBindingRevision
        - configurationStatus
        - captureRunning
      properties:
        unitId:
          $ref: "#/components/schemas/ProjectUuid"
        name:
          type: string
        typeId:
          type: string
          const: pamguard.acquisition
        sampleRateHz:
          type:
            - number
            - "null"
          exclusiveMinimum: 0
        channelCount:
          type:
            - integer
            - "null"
          minimum: 1
        hostBindingRevision:
          type:
            - integer
            - "null"
          format: int64
