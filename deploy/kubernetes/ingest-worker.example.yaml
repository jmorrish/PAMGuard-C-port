apiVersion: v1
kind: ConfigMap
metadata:
  name: pamguard-ingest-station-001
data:
  ingest-sources.json: |
    {
      "schemaVersion": 2,
      "mode": "active-project",
      "engine": "http://pamguard-engine:8080",
      "projectId": "11111111-1111-4111-8111-111111111111",
      "ffmpeg": "ffmpeg",
      "apiKeyEnv": "PAMGUARD_API_KEY",
      "statusFile": "/var/run/pamguard-ingest/status.json",
      "cursorDirectory": "/var/run/pamguard-ingest/cursors",
      "workerRestartDelaySeconds": 5,
      "maxWorkerRestarts": 0,
      "defaults": {
        "sampleRateHz": 48000,
        "channels": 2,
        "chunkFrames": 4096,
        "restart": true,
        "restartDelayMs": 5000,
        "realtime": true
      },
      "sources": [
        {
          "enabled": true,
          "id": "station-001",
          "acquisitionUnitId": "22222222-2222-4222-8222-222222222222",
          "source": "http://station.example/live.mp3"
        }
      ]
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pamguard-ingest-station-001-state
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pamguard-ingest-station-001
  labels:
    app: pamguard-ingest
    source: station-001
spec:
  # A second replica would race the same Acquisition timeline and cursor.
  replicas: 1
  # Do not overlap old/new pods during an update.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pamguard-ingest
      source: station-001
  template:
    metadata:
      labels:
        app: pamguard-ingest
        source: station-001
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: ingest
          image: pamguard-engine:local
          imagePullPolicy: IfNotPresent
          env:
            - name: PAMGUARD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pamguard-engine-api-key
                  key: api-key
          command:
            - python3
            - /app/ops/ingest_supervisor.py
          args:
            - --config
            - /etc/pamguard-ingest/ingest-sources.json
          volumeMounts:
            - name: config
              mountPath: /etc/pamguard-ingest
              readOnly: true
            - name: state
              mountPath: /var/run/pamguard-ingest
          resources:
            requests:
              cpu: "250m"
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: pamguard-ingest-station-001
        - name: state
          persistentVolumeClaim:
            claimName: pamguard-ingest-station-001-state
